plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'

    id 'com.chaquo.python'
}

apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdk = 36

    signingConfigs {
        release {
            keyAlias 'app_key_1'
            keyPassword 'GottaSign2024'
            storeFile file('C:/Users/Eric/AppStuff/eric_app_signing.jks')
            storePassword 'SeeItsMe2024'
        }
    }

    defaultConfig {
        applicationId "com.builditmyself.collectionsview"
        minSdk = 30
        targetSdk = 35
        versionCode = 3
        versionName = "1.2"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        python {
            version "3.13"
            pip {
                install "pymongo==4.13.2"
                install "dnspython==2.7.0"
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_23
        targetCompatibility JavaVersion.VERSION_23
    }
    kotlin {
        jvmToolchain(23)
    }
    buildFeatures {
        viewBinding = true
        dataBinding = true
    }
    namespace = 'com.builditmyself.collectionsview'

}

dependencies {
    def nav_version = '2.9.2'
    def lifecycle_version = '2.9.2'

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // Preferences DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.2'
}